name: Face Detection Model CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy opencv-python torch  # Added Torch/SciPy as they handle Jacobians well
        if [ -f requirements.txt ]; then pip install -r requirements.txt; if

    - name: Run Face Detection Script
      run: |
        python detect.py
